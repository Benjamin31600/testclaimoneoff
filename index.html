<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769e0"><title>Radar Poupon Mirabel</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#1769e0;color:#fff;padding:24px 18px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}button{border:0;border-radius:12px;padding:13px 16px;background:#1769e0;color:#fff;font-weight:700;font-size:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd3df;border-radius:10px}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#e8f6ed;color:#176b35;font-size:12px;font-weight:700;margin:2px}.unknown{background:#fff4dc;color:#7a5700}.no{background:#fbe9e9;color:#9a2020}.result{border-left:5px solid #1769e0}.small{font-size:13px;color:#657086}a{color:#1769e0}</style></head><body><header><h1>🔎 Radar Poupon Mirabel</h1><div>Milieux familiaux subventionnés • poupons 0–17 mois</div></header><main><div class="card"><h2>📍 Recherche</h2><p><b>Adresse :</b> 10774 rue du Cerf, Mirabel</p><div class="grid"><label>Rayon km<input id="radius" type="number" value="10"></label><label>Âge de Scott (mois)<input id="age" type="number" value="14"></label></div><p><button onclick="geo()">📍 Activer GPS</button> <button onclick="scan()">🔎 SCANNER</button></p><div id="status" class="small">Prêt.</div></div><div class="card"><h2>Résultats</h2><div id="results"></div></div><div class="card"><h2>Recherches publiques</h2><button onclick="search('google')">Google</button> <button onclick="search('reddit')">Reddit</button> <button onclick="search('facebook')">Facebook public</button> <button onclick="search('laurentides')">Laurentides</button></div></main><script>const data=[['Julie Charbonneau','Milieu familial subventionné','À vérifier','À vérifier','Mirabel'],['Chez Sandra','Milieu familial subventionné','À vérifier','À vérifier','Mirabel'],['Lynda Simard','Milieu familial subventionné','À vérifier','À vérifier','Mirabel'],['Milieu familial Mirabel','Subventionné','NON — fiche 18 mois et +','À vérifier','Mirabel']];function render(){results.innerHTML=data.map(x=>`<div class="card result"><h3>${x[0]}</h3><div>${x[4]}</div><p><span class="badge">${x[1]}</span><span class="badge unknown">Poupon: ${x[2]}</span><span class="badge unknown">Immédiat: ${x[3]}</span></p><span class="small">Disponibilité à confirmer directement auprès du milieu.</span></div>`).join('')}function geo(){navigator.geolocation?.getCurrentPosition(p=>status.textContent='GPS activé : '+p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5),()=>alert('Autorise la localisation dans Safari.'))}function scan(){status.textContent='Scan configuré : rayon '+radius.value+' km, poupon '+age.value+' mois. Les places non publiées restent à confirmer.';render()}function search(k){let q='milieu familial subventionné poupon Mirabel place disponible immédiatement';if(k==='reddit')q+=' site:reddit.com';if(k==='laurentides')q+=' site:milieufamiliallaurentides.ca';let u=k==='facebook'?'https://www.facebook.com/search/top?q='+encodeURIComponent(q):'https://www.google.com/search?q='+encodeURIComponent(q);window.open(u,'_blank')}render()</script></body></html>
