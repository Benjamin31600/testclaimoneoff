<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769e0"><title>Radar Poupon</title><style>body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#1769e0;color:#fff;padding:22px}main{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input{width:100%;box-sizing:border-box;padding:11px;margin-top:5px;border:1px solid #ccd3df;border-radius:10px}button{border:0;border-radius:12px;padding:13px 16px;background:#1769e0;color:#fff;font-weight:700;margin:5px 2px}.error{background:#fff0f0;color:#9a2020}.ok{color:#176b35}.small{font-size:13px;color:#657086}.result{border-left:5px solid #1769e0}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eaf3ff;color:#1255a0;font-size:12px;font-weight:700;margin:2px}a{color:#1769e0}</style></head><body><header><h1>🔎 Radar Poupon</h1><div>Recherche publique multi-sources • fraîcheur récente</div></header><main><div class="card"><div class="grid"><label>Adresse<input id="address" value="10774 rue du Cerf, Mirabel"></label><label>Ville<input id="city" value="Mirabel"></label><label>Rayon km<input id="radius" type="number" value="10" min="1" max="50"></label><label>Âge du bébé (mois)<input id="age" type="number" value="14" min="0" max="17"></label></div><button onclick="go()">🔎 Rechercher maintenant</button><button onclick="gps()">📍 GPS</button><p id="status" class="small">Prêt.</p></div><div class="card"><h2>Résultats <span id="count"></span></h2><div id="results">Lance une recherche.</div></div></main><script>let pos={lat:45.748591,lon:-74.066237};const $=x=>document.getElementById(x);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function go(){const city=$('city').value.trim(),address=$('address').value.trim(),r=$('radius').value,age=$('age').value;$('status').textContent='🔎 Recherche multi-sources en cours…';try{const u=`/api/search?lat=${pos.lat}&lon=${pos.lon}&radius=${encodeURIComponent(r)}&city=${encodeURIComponent(city)}&address=${encodeURIComponent(address)}&age=${encodeURIComponent(age)}&fresh=1`;const res=await fetch(u,{cache:'no-store'});const txt=await res.text();let d;try{d=JSON.parse(txt)}catch(e){throw Error('Réponse API non JSON ('+res.status+')')};if(!res.ok||!d.ok)throw Error(d.error||'Erreur API '+res.status);$('status').className='small ok';$('status').textContent=`✅ ${d.count} résultat(s) • ${d.sourcesChecked} moteur(s) • ${d.searchQueries} recherches • ${new Date(d.updatedAt).toLocaleTimeString('fr-CA')}`;$('count').textContent='('+d.count+')';if(!d.count){$('results').innerHTML=`<div class="card"><b>Aucun résultat public retourné.</b><p>${esc(d.diagnostic)}</p>${d.sourceErrors?.length?'<p>Erreurs sources : '+esc(d.sourceErrors.join(' | '))+'</p>':''}</div>`}else{$('results').innerHTML=d.providers.map(x=>`<div class="card result"><h3>${esc(x.name)}</h3><span class="badge">${esc(x.status)}</span>${x.infantPlaces?'<span class="badge">🍼 poupon</span>':''}${x.subsidized?'<span class="badge">💰 subventionné</span>':''}<p>${esc(x.city)} ${esc(x.address)}</p><p>📏 ${x.distanceKm==null?'Distance à confirmer':esc(x.distanceKm)+' km'}</p>${x.published?'<p>📅 '+esc(x.published)+'</p>':''}<p>${esc(x.snippet||'')}</p><p>🔗 <a href="${esc(x.source)}" target="_blank" rel="noopener">Source originale</a></p></div>`).join('')}}catch(e){$('status').className='small error';$('status').textContent='❌ '+e.message}}function gps(){navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude};$('status').textContent='📍 GPS activé — recherche recalculée';go()},()=>alert('Autorise la localisation dans Safari.'))}</script></body></html>
