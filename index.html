<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769e0"><title>Radar Poupon Mirabel</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#1769e0;color:#fff;padding:24px 18px}main{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}button{border:0;border-radius:12px;padding:13px 16px;background:#1769e0;color:#fff;font-weight:700;font-size:15px;margin:4px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd3df;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.result{border-left:5px solid #1769e0}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#e8f6ed;color:#176b35;font-size:12px;font-weight:700;margin:2px}.small{font-size:13px;color:#657086}.error{background:#fff0f0;color:#9a2020}.ok{background:#eef8f0;color:#176b35}a{color:#1769e0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:5}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.row{padding:10px 0;border-bottom:1px solid #edf0f4}.row b{display:block}</style></head><body><header><h1>🔎 Radar Poupon Mirabel</h1><div>Milieux familiaux subventionnés • poupons 0–17 mois</div></header><main><div class="card"><h2>📍 Recherche</h2><p><b>10774 rue du Cerf, Mirabel</b></p><div class="grid"><label>Rayon (km)<input id="radius" type="number" value="10" min="1" max="50"></label><label>Âge (mois)<input id="age" type="number" value="14" min="0" max="17"></label></div><button onclick="loadData()">🔄 Actualiser</button><button onclick="geo()">📍 Ma position</button><div id="status" class="small">Chargement…</div></div><div class="card"><h2>🎯 Résultats <span id="count"></span></h2><div id="results">Chargement…</div></div></main><div id="modal" class="modal"><div class="sheet"><button onclick="closeModal()">Fermer</button><div id="detail"></div></div></div><script>const HOME={lat:45.748591,lon:-74.066237};let center=HOME,providers=[];const $=id=>document.getElementById(id);function hav(a,b){const R=6371,p=Math.PI/180,d1=(b.lat-a.lat)*p,d2=(b.lon-a.lon)*p,x=Math.sin(d1/2)**2+Math.cos(a.lat*p)*Math.cos(b.lat*p)*Math.sin(d2/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function loadData(){ $('status').textContent='Actualisation…';try{const r=await fetch('data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('data.json indisponible ('+r.status+')');const d=await r.json();providers=d.items||[];$('status').className='small ok';$('status').textContent='Données publiques chargées • '+new Date(d.updatedAt).toLocaleString('fr-CA');render()}catch(e){$('status').className='small error';$('status').textContent='Le moteur de données n’est pas encore publié : '+e.message;$('results').innerHTML='<p>Le site est en ligne, mais les données attendent le workflow GitHub.</p>'}}function render(){const max=+$('radius').value||10;const rows=providers.map((x,i)=>({...x,_i:i,distanceKm:x.lat?hav(center,x):null})).filter(x=>x.distanceKm==null||x.distanceKm<=max).sort((a,b)=>(a.distanceKm??999)-(b.distanceKm??999));$('count').textContent='('+rows.length+')';$('results').innerHTML=rows.length?rows.map(x=>`<div class="card result" onclick="detail(${x._i})"><h3>${esc(x.name)}</h3><span class="badge">💰 Subventionné</span><span class="badge">🍼 ${x.infantPlaces||0} place(s) poupon</span><span class="badge">📏 ${x.distanceKm==null?'à confirmer':x.distanceKm.toFixed(1)+' km'}</span><p>${esc(x.city||'')} ${esc(x.postalCode||'')}</p><div class="small">${esc(x.availableFrom?'Disponible : '+x.availableFrom:'Disponibilité à confirmer')}</div></div>`).join(''):'<p>Aucune fiche publique dans le rayon.</p>'}function detail(i){const x=providers[i],d=x.lat?hav(center,x):null;$('detail').innerHTML=`<h2>${esc(x.name)}</h2><p><span class="badge">💰 Subventionné</span> <span class="badge">🍼 ${x.infantPlaces||0} place(s) 0–18 mois</span></p><div class="row"><b>📍 Adresse professionnelle</b>${esc(x.address||'Non publiée')}<br>${esc(x.postalCode||'')} ${esc(x.city||'')}</div><div class="row"><b>📏 Distance</b>${d==null?'Non calculable':d.toFixed(1)+' km'}</div><div class="row"><b>📞 Téléphone</b>${x.phone?`<a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:'Non publié'}</div><div class="row"><b>✉️ Courriel</b>${x.email?`<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:'Non publié'}</div><div class="row"><b>🕐 Horaires</b>${esc(x.hours||'Non publié')}</div><div class="row"><b>📅 Disponibilité</b>${esc(x.availableFrom||'À confirmer')}</div><div class="row"><b>🌐 Source</b><br><a target="_blank" href="${esc(x.url||'#')}">Voir la fiche originale</a></div>`;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function geo(){navigator.geolocation?.getCurrentPosition(p=>{center={lat:p.coords.latitude,lon:p.coords.longitude};$('status').textContent='GPS activé : distances recalculées.';render()},()=>alert('Autorise la localisation dans Safari.'))}$('radius').oninput=render;loadData();setInterval(loadData,1800000);</script></body></html>
