<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar Poupon intelligent</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:#1769e0;color:white;padding:22px 18px}main{max-width:980px;margin:auto;padding:14px}.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}label{font-size:13px;font-weight:700}input{box-sizing:border-box;width:100%;margin-top:5px;padding:11px;border:1px solid #ccd3df;border-radius:10px;font-size:15px}button{border:0;border-radius:12px;padding:13px 16px;background:#1769e0;color:#fff;font-weight:700;font-size:15px;margin:5px 3px}.result{border-left:5px solid #1769e0}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#e8f6ed;color:#176b35;font-size:12px;font-weight:700;margin:2px}.yellow{background:#fff7d6;color:#735400}.gray{background:#edf0f4;color:#4c5565}.small{font-size:13px;color:#657086}.error{background:#fff0f0;color:#9a2020}.ok{background:#eef8f0;color:#176b35}a{color:#1769e0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.row{padding:10px 0;border-bottom:1px solid #edf0f4}.row b{display:block}</style></head><body><header><h1>🔎 Radar Poupon intelligent</h1><div>Recherche locale multi-sources publiques</div></header><main><div class="card"><h2>📍 Recherche</h2><div class="grid"><label>Adresse<input id="address" value="10774 rue du Cerf, Mirabel"></label><label>Ville<input id="city" value="Mirabel"></label><label>Rayon (km)<input id="radius" type="number" value="10" min="1" max="50"></label><label>Âge du bébé (mois)<input id="age" type="number" value="14" min="0" max="17"></label></div><button onclick="search()">🔎 RECHERCHER MAINTENANT</button><button onclick="geo()">📍 GPS</button><div id="status" class="small">Prêt.</div></div><div class="card"><h2>🎯 Résultats <span id="count"></span></h2><p class="small">Les fiches sont classées par fraîcheur, disponibilité, confiance puis distance. Une fiche officielle sans disponibilité explicite reste visible.</p><div id="results">Lance une recherche.</div></div></main><div id="modal" class="modal"><div class="sheet"><button onclick="closeModal()">Fermer</button><div id="detail"></div></div></div><script>const HOME={lat:45.748591,lon:-74.066237};let center=HOME,providers=[];const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}async function search(){const address=$('address').value.trim(),city=$('city').value.trim(),radius=+$('radius').value||10,age=+$('age').value||14;$('status').textContent='🔎 Recherche multi-sources en cours…';$('results').innerHTML='<p>⏳ Recherche du répertoire officiel et des sources publiques…</p>';try{const u=`/api/search?lat=${center.lat}&lon=${center.lon}&radius=${radius}&city=${encodeURIComponent(city)}&address=${encodeURIComponent(address)}&age=${age}&fresh=1`;const r=await fetch(u,{cache:'no-store'});const text=await r.text();let d;try{d=JSON.parse(text)}catch{throw Error('Réponse serveur invalide ('+r.status+')')}if(!r.ok||!d.ok)throw Error(d.error||('API '+r.status));providers=d.providers||[];$('status').className='small ok';$('status').textContent=`✅ ${providers.length} résultat(s) • ${d.sourcesChecked||0} source(s) vérifiée(s) • ${new Date(d.updatedAt||Date.now()).toLocaleTimeString('fr-CA')}`;render()}catch(e){$('status').className='small error';$('status').textContent='❌ '+e.message;$('results').innerHTML='<div class="card error"><b>Le moteur a répondu avec une erreur.</b><br>Le détail ci-dessus permet maintenant de diagnostiquer le serveur Vercel.</div>'}}function render(){$('count').textContent='('+providers.length+')';$('results').innerHTML=providers.length?providers.map((x,i)=>{const state=x.availabilitySignal?'🟢 Disponibilité':x.intentSignal?'🟡 Signal / intention':'🔵 Fiche pertinente';return `<div class="card result" onclick="detail(${i})"><h3>${esc(x.name||'Milieu familial')}</h3><span class="badge">${state}</span><span class="badge ${x.subsidized===true?'':'yellow'}">${x.subsidized===true?'💰 Subventionné':'💰 Statut à confirmer'}</span><span class="badge">🍼 ${x.infantPlaces?'Poupon':'Âge à confirmer'}</span>${x.distanceKm!=null?`<span class="badge">📏 ${x.distanceKm.toFixed(1)} km</span>`:''}<p>${esc(x.address||x.city||'Localisation non publiée')}</p><div class="small">${x.publishedAt?'Publication : '+esc(x.publishedAt)+' • ':''}Confiance : ${x.confidence??'—'}/100</div><div class="small">Source : ${esc(x.sourceType||'publique')}</div></div>`}).join(''):'<div class="card"><b>Aucun résultat dans ce rayon.</b><p>Le serveur n’a trouvé aucune fiche publique exploitable. Essaie 20 km pour vérifier si le problème vient du rayon.</p></div>'}function detail(i){const x=providers[i];$('detail').innerHTML=`<h2>${esc(x.name||'Milieu familial')}</h2><p><span class="badge">${x.availabilitySignal?'🟢 Disponibilité':x.intentSignal?'🟡 Signal / intention':'🔵 Fiche pertinente'}</span> <span class="badge">Confiance ${x.confidence??'—'}/100</span></p><div class="row"><b>📍 Adresse</b>${esc(x.address||'Non publiée')}<br>${esc(x.postalCode||'')} ${esc(x.city||'')}</div><div class="row"><b>📏 Distance</b>${x.distanceKm==null?'Non calculable':x.distanceKm.toFixed(1)+' km'}</div><div class="row"><b>💰 Subventionné</b>${x.subsidized===true?'Oui':'À confirmer'}</div><div class="row"><b>🍼 Poupon</b>${x.infantPlaces?'Oui':'À confirmer'}</div><div class="row"><b>📞 Téléphone public</b>${x.phone?`<a href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:'Non publié'}</div><div class="row"><b>✉️ Courriel public</b>${x.email?`<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>`:'Non publié'}</div><div class="row"><b>📅 Fraîcheur</b>${esc(x.publishedAt||'Non trouvée')}${x.availableFrom?'<br>Disponibilité : '+esc(x.availableFrom):''}</div><div class="row"><b>🧠 Preuve</b>${esc((x.evidence&&x.evidence[0])||'Voir la source originale.')}</div><div class="row"><b>🌐 Source</b><br>${x.source?`<a target="_blank" rel="noopener" href="${esc(x.source)}">Ouvrir la source originale</a>`:'Non disponible'}</div>`;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function geo(){if(!navigator.geolocation)return alert('GPS non disponible');navigator.geolocation.getCurrentPosition(p=>{center={lat:p.coords.latitude,lon:p.coords.longitude};$('status').textContent='📍 GPS activé';search()},e=>alert('Autorise la localisation dans Safari.'))}</script></body></html>
