name: Radar Poupon - mise a jour et publication
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Installer les dependances
        run: pip install requests beautifulsoup4
      - name: Actualiser les disponibilites publiques
        run: python scripts/update_data.py
      - name: Activer et configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Construire l artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
