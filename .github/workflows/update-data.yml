name: Mise a jour Radar Poupon
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Recuperer les disponibilites publiques Laurentides
        run: python update.py
      - name: Enregistrer les nouvelles donnees
        run: |
          git config user.name 'radar-poupon-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data.json
          git diff --cached --quiet || git commit -m 'Actualiser les disponibilites publiques'
          git push
